<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz auditivo - Bajo 5 cuerdas</title>
  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111827;
      color: white;
      margin: 0;
      padding: 24px;
    }

    .container {
      max-width: 720px;
      margin: auto;
      background: #1f2937;
      padding: 24px;
      border-radius: 16px;
    }

    h1, h2 {
      text-align: center;
    }

    button, select, input, textarea {
      font-size: 16px;
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      margin: 6px;
    }

    button {
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    button:hover {
      background: #1d4ed8;
    }

    .note-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 8px;
      margin: 16px 0;
    }

    label {
      background: #374151;
      padding: 8px;
      border-radius: 8px;
      text-align: center;
    }

    input, textarea, select {
      background: #111827;
      color: white;
    }

    textarea {
      box-sizing: border-box;
      min-height: 84px;
      resize: vertical;
      width: 100%;
    }

    .config-panel {
      background: #374151;
      border-radius: 12px;
      margin-top: 24px;
      padding: 16px;
    }

    .config-row {
      margin-bottom: 12px;
    }

    .config-row label {
      display: block;
      margin: 0 0 6px;
      text-align: left;
    }

    .config-status {
      color: #bfdbfe;
      min-height: 24px;
    }

    .options button {
      width: 30%;
      min-width: 90px;
      background: #4b5563;
      border: 2px solid transparent;
      box-sizing: border-box;
    }

    .options button.correct {
      border-color: #22c55e;
      background: #166534;
    }

    .options button.incorrect {
      border-color: #ef4444;
      background: #7f1d1d;
    }

    .options button:disabled {
      cursor: default;
      opacity: 0.9;
    }

    .feedback {
      margin-top: 20px;
      padding: 16px;
      background: #374151;
      border-radius: 12px;
      line-height: 1.5;
    }

    .hidden {
      display: none;
    }

    .play {
      font-size: 42px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      display: block;
      margin: 24px auto;
    }

    .sing-note {
      font-size: 48px;
      font-weight: 700;
      min-height: 64px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Quiz auditivo para bajo de 5 cuerdas</h1>

    <section id="setup">
      <h2>Configurar práctica</h2>

      <p>Escoge el modo de práctica:</p>

      <button onclick="setPracticeMode('quiz')">Quiz auditivo</button>
      <button onclick="setPracticeMode('sing')">Cantar notas</button>

      <p>Escoge cómo quieres seleccionar las notas:</p>

      <button onclick="setMode('range')">Por rango</button>
      <button onclick="setMode('manual')">Selección manual</button>

      <div id="rangeMode">
        <h3>Seleccionar por rango</h3>
        <label>Desde:</label>
        <select id="fromNote"></select>

        <label>Hasta:</label>
        <select id="toNote"></select>
      </div>

      <div id="manualMode" class="hidden">
        <h3>Seleccionar notas manualmente</h3>
        <div id="noteCheckboxes" class="note-grid"></div>
      </div>

      <section class="config-panel">
        <h3>Configuración</h3>

        <div class="config-row">
          <label for="configDefaultMode">defaultMode</label>
          <select id="configDefaultMode">
            <option value="range">Por rango</option>
            <option value="manual">Selección manual</option>
          </select>
        </div>

        <div class="config-row">
          <label for="configSelectionNotes">defaultSelectionNotes</label>
          <textarea id="configSelectionNotes" spellcheck="false"></textarea>
        </div>

        <div class="config-row">
          <label>defaultRangeNotes</label>
          <select id="configFromNote"></select>
          <select id="configToNote"></select>
        </div>

        <div class="config-row">
          <label for="configNoteDuration">noteDuration</label>
          <input id="configNoteDuration" type="text" />
        </div>

        <div class="config-row">
          <label for="configAutoNextDelayMs">autoNextDelayMs</label>
          <input id="configAutoNextDelayMs" type="number" min="0" step="100" />
        </div>

        <div class="config-row">
          <label for="configInstrument">instrument</label>
          <select id="configInstrument">
            <option value="synth">Sintetizador</option>
            <option value="piano">Piano</option>
            <option value="bass">Bajo</option>
            <option value="guitar">Guitarra</option>
          </select>
        </div>

        <button onclick="applyConfigFromForm()">Aplicar configuración</button>
        <p id="configStatus" class="config-status"></p>
      </section>

      <button onclick="startQuiz()">Empezar práctica</button>
    </section>

    <section id="quiz" class="hidden">
      <h2 id="questionTitle">Pregunta</h2>

      <button class="play" onclick="playCurrentNote()">▶</button>

      <p style="text-align:center;">¿Qué nota escuchaste?</p>

      <div id="options" class="options" style="text-align:center;"></div>

      <div id="feedback" class="feedback hidden"></div>

      <div style="text-align:center;">
        <button id="retryButton" class="hidden" onclick="retryQuestion()">Repetir</button>
        <button id="nextButton" class="hidden" onclick="nextQuestion()">Siguiente</button>
      </div>
    </section>

    <section id="sing" class="hidden">
      <h2 id="singQuestionTitle">Cantar nota</h2>

      <p style="text-align:center;">Canta la nota antes de revelarla.</p>

      <div id="singNoteDisplay" class="sing-note">?</div>

      <div style="text-align:center;">
        <button id="revealSingNoteButton" onclick="revealSingNote()">Ver nota</button>
        <button id="playSingNoteButton" class="hidden" onclick="playCurrentNote()">▶</button>
        <button id="nextSingButton" class="hidden" onclick="nextSingQuestion()">Siguiente</button>
      </div>
    </section>
  </div>

  <script>
    const notes = [
      "B0","C1","C#1","D1","D#1","E1","F1","F#1","G1","G#1","A1","A#1",
      "B1","C2","C#2","D2","D#2","E2","F2","F#2","G2","G#2","A2","A#2",
      "B2","C3","C#3","D3","D#3","E3","F3","F#3","G3","G#3","A3","A#3",
      "B3","C4","C#4","D4","D#4","E4","F4","F#4","G4"
    ];

    const explanations = {
      "B0": "B0 es la nota más grave típica de un bajo de 5 cuerdas. Suena muy profunda, pesada y oscura.",
      "E1": "E1 es la cuarta cuerda de un bajo estándar. Es grave, estable y muy usada como referencia.",
      "G2": "G2 está en un registro grave-medio. Suena sobria, estable y con cuerpo.",
      "A2": "A2 está un tono por encima de G2. Se siente un poco más clara y menos pesada.",
      "B2": "B2 es más aguda que G2 y A2. Tiene más definición y algo más de brillo.",
      "F3": "F3 está en un registro medio. Suena más presente y menos grave que las notas de la octava 2.",
      "G3": "G3 es una octava más aguda que G2. Conserva el color de sol, pero suena más brillante.",
      "G4": "G4 es una de las notas más agudas disponibles en un bajo de 5 cuerdas de 24 trastes. Suena clara, brillante y ligera."
    };

    let mode = "range";
    let practiceMode = "quiz";
    let selectedNotes = [];
    let currentNote = null;
    let questionNumber = 1;
    let instrumentSynth = null;
    let currentInstrument = null;
    let nextQuestionTimeout = null;

    const defaultConfig = {
      defaultMode: "manual",
      defaultSelectionNotes: ["G2", "A2", "B2", "F3", "G3"],
      defaultRangeNotes: ["G2", "G3"],
      noteDuration: "1m",
      autoNextDelayMs: 800,
      instrument: "bass"
    };
    let appConfig = { ...defaultConfig };

    const fromSelect = document.getElementById("fromNote");
    const toSelect = document.getElementById("toNote");
    const noteCheckboxes = document.getElementById("noteCheckboxes");
    const configDefaultMode = document.getElementById("configDefaultMode");
    const configSelectionNotes = document.getElementById("configSelectionNotes");
    const configFromNote = document.getElementById("configFromNote");
    const configToNote = document.getElementById("configToNote");
    const configNoteDuration = document.getElementById("configNoteDuration");
    const configAutoNextDelayMs = document.getElementById("configAutoNextDelayMs");
    const configInstrument = document.getElementById("configInstrument");
    const configStatus = document.getElementById("configStatus");

    notes.forEach(note => {
      fromSelect.innerHTML += `<option value="${note}">${note}</option>`;
      toSelect.innerHTML += `<option value="${note}">${note}</option>`;
      configFromNote.innerHTML += `<option value="${note}">${note}</option>`;
      configToNote.innerHTML += `<option value="${note}">${note}</option>`;

      noteCheckboxes.innerHTML += `
        <label>
          <input type="checkbox" value="${note}" />
          ${note}
        </label>
      `;
    });

    applyConfig(defaultConfig);
    loadConfig();

    async function loadConfig() {
      try {
        const response = await fetch("config.json");
        if (!response.ok) return;

        const config = await response.json();
        applyConfig({
          ...defaultConfig,
          ...config
        });
      } catch (error) {
        console.warn("No se pudo cargar config.json. Se usará la configuración por defecto.", error);
      }
    }

    function applyConfig(config) {
      appConfig = {
        ...defaultConfig,
        ...config
      };

      if (["range", "manual"].includes(appConfig.defaultMode)) {
        setMode(appConfig.defaultMode);
        configDefaultMode.value = appConfig.defaultMode;
      }

      const [fromNote, toNote] = appConfig.defaultRangeNotes || [];

      if (notes.includes(fromNote)) {
        fromSelect.value = fromNote;
        configFromNote.value = fromNote;
      }

      if (notes.includes(toNote)) {
        toSelect.value = toNote;
        configToNote.value = toNote;
      }

      const selectedDefaults = new Set(
        (appConfig.defaultSelectionNotes || []).filter(note => notes.includes(note))
      );

      document.querySelectorAll("#noteCheckboxes input").forEach(input => {
        input.checked = selectedDefaults.has(input.value);
      });

      configSelectionNotes.value = [...selectedDefaults].join(", ");
      configNoteDuration.value = appConfig.noteDuration;
      configAutoNextDelayMs.value = appConfig.autoNextDelayMs;
      configInstrument.value = appConfig.instrument;
    }

    function applyConfigFromForm() {
      const defaultSelectionNotes = configSelectionNotes.value
        .split(",")
        .map(note => note.trim())
        .filter(Boolean);

      const invalidNotes = defaultSelectionNotes.filter(note => !notes.includes(note));

      if (invalidNotes.length > 0) {
        configStatus.textContent = `Notas no válidas: ${invalidNotes.join(", ")}`;
        return;
      }

      if (notes.indexOf(configFromNote.value) > notes.indexOf(configToNote.value)) {
        configStatus.textContent = "El rango debe ir de grave a agudo.";
        return;
      }

      if (!configNoteDuration.value.trim()) {
        configStatus.textContent = "noteDuration no puede estar vacío.";
        return;
      }

      const autoNextDelayMs = Number(configAutoNextDelayMs.value);

      if (!Number.isFinite(autoNextDelayMs) || autoNextDelayMs < 0) {
        configStatus.textContent = "autoNextDelayMs debe ser un número mayor o igual que 0.";
        return;
      }

      if (!["synth", "piano", "bass", "guitar"].includes(configInstrument.value)) {
        configStatus.textContent = "Selecciona un instrumento válido.";
        return;
      }

      if (configInstrument.value !== appConfig.instrument) {
        resetInstrument();
      }

      applyConfig({
        defaultMode: configDefaultMode.value,
        defaultSelectionNotes,
        defaultRangeNotes: [configFromNote.value, configToNote.value],
        noteDuration: configNoteDuration.value.trim(),
        autoNextDelayMs,
        instrument: configInstrument.value
      });

      configStatus.textContent = "Configuración aplicada en esta sesión.";
    }

    function setMode(newMode) {
      mode = newMode;
      configDefaultMode.value = mode;

      document.getElementById("rangeMode").classList.toggle("hidden", mode !== "range");
      document.getElementById("manualMode").classList.toggle("hidden", mode !== "manual");
    }

    function setPracticeMode(newPracticeMode) {
      practiceMode = newPracticeMode;
    }

    function startQuiz() {
      selectedNotes = getSelectedNotes();

      if (practiceMode === "quiz" && selectedNotes.length < 3) {
        alert("Selecciona al menos 3 notas para poder crear opciones.");
        return;
      }

      if (practiceMode === "sing" && selectedNotes.length < 1) {
        alert("Selecciona al menos 1 nota para practicar canto.");
        return;
      }

      document.getElementById("setup").classList.add("hidden");
      document.getElementById("quiz").classList.toggle("hidden", practiceMode !== "quiz");
      document.getElementById("sing").classList.toggle("hidden", practiceMode !== "sing");

      if (practiceMode === "quiz") {
        nextQuestion();
      } else {
        nextSingQuestion();
      }
    }

    function getSelectedNotes() {
      if (mode === "range") {
        const fromIndex = notes.indexOf(fromSelect.value);
        const toIndex = notes.indexOf(toSelect.value);

        if (fromIndex > toIndex) {
          alert("La nota inicial debe ser más grave que la final.");
          return [];
        }

        return notes.slice(fromIndex, toIndex + 1);
      }

      return [...document.querySelectorAll("#noteCheckboxes input:checked")]
        .map(input => input.value);
    }

    function nextQuestion() {
      clearTimeout(nextQuestionTimeout);
      document.getElementById("feedback").classList.add("hidden");
      document.getElementById("retryButton").classList.add("hidden");
      document.getElementById("nextButton").classList.add("hidden");

      currentNote = randomItem(selectedNotes);

      document.getElementById("questionTitle").textContent = `Pregunta ${questionNumber}`;

      const options = generateOptions(currentNote);
      const optionsDiv = document.getElementById("options");

      optionsDiv.innerHTML = "";

      options.forEach(note => {
        const button = document.createElement("button");
        button.textContent = note;
        button.onclick = () => checkAnswer(note, button);
        optionsDiv.appendChild(button);
      });

      questionNumber++;
    }

    function nextSingQuestion() {
      currentNote = randomItem(selectedNotes);

      document.getElementById("singQuestionTitle").textContent = `Cantar nota ${questionNumber}`;
      document.getElementById("singNoteDisplay").textContent = "?";
      document.getElementById("revealSingNoteButton").classList.remove("hidden");
      document.getElementById("playSingNoteButton").classList.add("hidden");
      document.getElementById("nextSingButton").classList.add("hidden");

      questionNumber++;
    }

    function revealSingNote() {
      document.getElementById("singNoteDisplay").textContent = currentNote;
      document.getElementById("revealSingNoteButton").classList.add("hidden");
      document.getElementById("playSingNoteButton").classList.remove("hidden");
      document.getElementById("nextSingButton").classList.remove("hidden");

      playCurrentNote();
    }

    function generateOptions(correctNote) {
      const wrongNotes = selectedNotes.filter(note => note !== correctNote);
      shuffle(wrongNotes);

      const options = [correctNote, wrongNotes[0], wrongNotes[1]];
      return shuffle(options);
    }

    function checkAnswer(answer, selectedButton) {
      const feedback = document.getElementById("feedback");
      feedback.classList.remove("hidden");
      document.querySelectorAll("#options button").forEach(button => {
        button.disabled = true;
      });

      if (answer === currentNote) {
        selectedButton.classList.add("correct");
        feedback.innerHTML = `
          <strong>Correcto.</strong><br>
          Era ${currentNote}.
        `;

        nextQuestionTimeout = setTimeout(nextQuestion, appConfig.autoNextDelayMs);
      } else {
        selectedButton.classList.add("incorrect");
        feedback.innerHTML = `
          <strong>Incorrecto.</strong><br>
          La respuesta correcta era <strong>${currentNote}</strong>.<br><br>
          ${getExplanation(currentNote)}
        `;

        document.getElementById("retryButton").classList.remove("hidden");
        document.getElementById("nextButton").classList.remove("hidden");
      }
    }

    function retryQuestion() {
      document.getElementById("feedback").classList.add("hidden");
      document.getElementById("retryButton").classList.add("hidden");
      document.getElementById("nextButton").classList.add("hidden");

      document.querySelectorAll("#options button").forEach(button => {
        button.disabled = false;
        button.classList.remove("correct", "incorrect");
      });

      playCurrentNote();
    }

    function getExplanation(note) {
      if (explanations[note]) return explanations[note];

      const octave = note.match(/\d/)[0];

      if (octave <= 1) {
        return `${note} está en un registro muy grave del bajo. Suele sentirse profunda, oscura y con mucho peso.`;
      }

      if (octave == 2) {
        return `${note} está en un registro grave-medio. Tiene cuerpo, pero ya se distingue con más claridad que las notas más bajas.`;
      }

      if (octave == 3) {
        return `${note} está en un registro medio. Suena más clara, definida y melódica.`;
      }

      return `${note} está en un registro agudo del bajo. Suena brillante, ligera y muy definida.`;
    }

    function playCurrentNote() {
      playNote(currentNote);
    }

    async function playNote(note) {
      if (!note) return;

      await Tone.start();
      getInstrument().triggerAttackRelease(note, appConfig.noteDuration);
    }

    function getInstrument() {
      if (instrumentSynth && currentInstrument === appConfig.instrument) {
        return instrumentSynth;
      }

      resetInstrument();
      currentInstrument = appConfig.instrument;

      if (appConfig.instrument === "synth") {
        instrumentSynth = new Tone.Synth({
          oscillator: {
            type: "triangle"
          },
          envelope: {
            attack: 0.02,
            decay: 0.2,
            sustain: 0.55,
            release: 1.1
          }
        }).toDestination();
        instrumentSynth.volume.value = -10;
      }

      if (appConfig.instrument === "piano") {
        instrumentSynth = new Tone.PolySynth(Tone.Synth, {
          oscillator: {
            type: "sine"
          },
          envelope: {
            attack: 0.01,
            decay: 0.35,
            sustain: 0.25,
            release: 1.4
          }
        }).toDestination();
        instrumentSynth.volume.value = -8;
      }

      if (appConfig.instrument === "bass") {
        instrumentSynth = new Tone.MonoSynth({
          oscillator: {
            type: "fatsawtooth",
            count: 2,
            spread: 12
          },
          envelope: {
            attack: 0.015,
            decay: 0.18,
            sustain: 0.45,
            release: 1.2
          },
          filter: {
            type: "lowpass",
            frequency: 900,
            Q: 1.5
          },
          filterEnvelope: {
            attack: 0.01,
            decay: 0.25,
            sustain: 0.25,
            release: 1.1,
            baseFrequency: 80,
            octaves: 3.2
          }
        }).toDestination();
        instrumentSynth.volume.value = -8;
      }

      if (appConfig.instrument === "guitar") {
        instrumentSynth = new Tone.MonoSynth({
          oscillator: {
            type: "pulse",
            width: 0.35
          },
          envelope: {
            attack: 0.005,
            decay: 0.22,
            sustain: 0.18,
            release: 0.9
          },
          filter: {
            type: "bandpass",
            frequency: 1600,
            Q: 2
          },
          filterEnvelope: {
            attack: 0.01,
            decay: 0.18,
            sustain: 0.2,
            release: 0.7,
            baseFrequency: 220,
            octaves: 2.5
          }
        }).toDestination();
        instrumentSynth.volume.value = -9;
      }

      return instrumentSynth;
    }

    function resetInstrument() {
      if (instrumentSynth) {
        instrumentSynth.dispose();
      }

      instrumentSynth = null;
      currentInstrument = null;
    }

    function randomItem(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }
  </script>
</body>
</html>
